<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}E-Rechnung für Stripe{% endblock %}</title>
<meta name="description" content="{% block description %}E-Rechnungen (XRechnung, ZUGFeRD) automatisch aus Stripe erzeugen und kostenlos prüfen – nach den offiziellen KoSIT-Regeln.{% endblock %}">
<style>
:root { --ink:#1b1f24; --muted:#5b6470; --line:#e3e6ea; --bg:#ffffff; --soft:#f5f7f9; --accent:#1f5fbf; --ok:#17733a; --warn:#9a5b00; --err:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --ink:#e8eaed; --muted:#a3abb5; --line:#2e333a; --bg:#15181c; --soft:#1d2126; --accent:#7fb0ff; --ok:#5fd18b; --warn:#f0b35a; --err:#ff8a80; } }
* { box-sizing:border-box; }
body { margin:0; font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); }
.wrap { max-width:880px; margin:0 auto; padding:0 16px; }
header { border-bottom:1px solid var(--line); }
header .wrap { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:6px 16px; min-height:56px; padding-top:10px; padding-bottom:10px; }
header a { color:var(--ink); text-decoration:none; font-weight:600; }
nav { display:flex; flex-wrap:wrap; gap:4px 16px; }
nav a { font-weight:400; color:var(--muted); }
.plans { display:grid; grid-template-columns:repeat(auto-fit,minmax(190px,1fr)); gap:12px; }
.plans .card { margin:0; }
.price { font-size:1.6rem; font-weight:700; }
.form .field { display:block; margin:10px 0; flex:1; min-width:0; }
.form .field span { display:block; font-weight:600; font-size:.95rem; margin-bottom:3px; }
.form .field input { width:100%; font-size:1rem; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); }
.form .field em { color:var(--err); font-style:normal; font-size:.9rem; }
.form .has-error input { border-color:var(--err); }
.form .row { display:flex; gap:12px; flex-wrap:wrap; }
.form .row .field { flex:1 1 180px; }
.check { display:block; margin:10px 0; }
form.inline { display:inline; }
.actions { display:flex; flex-wrap:wrap; gap:6px 18px; margin:12px 0 0; }
button.link { background:none; border:0; padding:0; color:var(--accent); text-decoration:underline; font:inherit; cursor:pointer; }
main { padding:32px 0 48px; }
h1 { font-size:2rem; line-height:1.2; margin:0 0 12px; }
h2 { font-size:1.3rem; margin:32px 0 10px; }
p.lead { font-size:1.15rem; color:var(--muted); margin:0 0 24px; }
.card { border:1px solid var(--line); border-radius:10px; padding:20px; background:var(--soft); margin:16px 0; }
.btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font-size:1rem; cursor:pointer; text-decoration:none; }
@media (prefers-color-scheme: dark) { .btn { color:#0d1117; } }
input[type=file], input[type=email] { font-size:1rem; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); max-width:100%; }
.muted { color:var(--muted); font-size:.92rem; }
.steps { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; }
.steps div { border:1px solid var(--line); border-radius:10px; padding:14px; }
.badge { display:inline-block; border-radius:999px; padding:2px 10px; font-size:.85rem; font-weight:600; }
.badge.ok { background:color-mix(in srgb,var(--ok) 15%,transparent); color:var(--ok); }
.badge.err { background:color-mix(in srgb,var(--err) 15%,transparent); color:var(--err); }
.badge.warn { background:color-mix(in srgb,var(--warn) 15%,transparent); color:var(--warn); }
table { width:100%; border-collapse:collapse; font-size:.95rem; }
th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
code { font-size:.9em; background:var(--soft); padding:1px 5px; border-radius:4px; overflow-wrap:anywhere; }
.finding { border-left:4px solid var(--err); padding:8px 12px; margin:10px 0; background:var(--soft); border-radius:0 8px 8px 0; }
.finding.warning { border-color:var(--warn); }
.finding.info { border-color:var(--line); }
footer { border-top:1px solid var(--line); padding:20px 0; color:var(--muted); font-size:.9rem; }
footer a { color:var(--muted); margin-right:16px; display:inline-block; }
ul.rules { columns:3 180px; padding-left:18px; }
</style>
</head>
<body>
<header><div class="wrap"><a href="/">E-Rechnung für Stripe</a><nav><a href="/#pruefen">Prüfen</a><a href="/preise">Preise</a><a href="/regeln">Fehlercodes</a>{% if stripe_app %}<a href="/konto">Konto</a>{% endif %}</nav></div></header>
<main><div class="wrap">{% block content %}{% endblock %}</div></main>
<footer><div class="wrap"><a href="/preise">Preise</a><a href="/agb">AGB</a><a href="/rueckerstattung">Rückerstattung</a><a href="/datenschutz">Datenschutz</a><a href="/impressum">Impressum</a><a href="/kontakt">Kontakt</a><br>Prüfregeln: KoSIT XRechnung 3.0 &amp; CEN EN 16931</div></footer>
</body>
</html>
